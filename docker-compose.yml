services:
  postgres:
    image: postgres:18
    container_name: repofix-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: repofix
      POSTGRES_PASSWORD: repofix
      POSTGRES_DB: repofix

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: