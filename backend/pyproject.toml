[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahul Shaw", email = "rahulsha9856@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "gitpython>=3.1.62",
    "google-genai>=2.23.0",
    "openai>=3.13.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pygithub>=2.10.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]
